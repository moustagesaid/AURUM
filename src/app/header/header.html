<!-- src/app/shared/header/header.component.html -->
<header class="navbar-container">
  <!-- Gold Border Lines -->
  <div class="gold-line top"></div>
  <div class="gold-line bottom"></div>

  <!-- Left Section: Menu and Links -->
  <div class="nav-left">
    <a routerLink="/" routerLinkActive="active-nav-link" [routerLinkActiveOptions]="{exact: true}" class="nav-link">Home</a>
    <a routerLink="/products" routerLinkActive="active-nav-link" class="nav-link">Products</a>
    <a routerLink="/contact" routerLinkActive="active-nav-link" class="nav-link">Contact</a>
    <a routerLink="/about" routerLinkActive="active-nav-link" class="nav-link">About Us</a>
  </div>

  <!-- Center Section: Logo -->
  <div class="nav-center">
    <a routerLink="/" class="logo-wrapper logo-link">
      <span class="logo-text">AURUM</span>
    </a>
  </div>

  <!-- Right Section: Icons -->
  <div class="nav-right">
    <app-theme-toggle></app-theme-toggle>
    <a routerLink="/products" class="icon-link">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
    </a>

    <!-- Logged out: login icon (opens modal) -->
    @if (!authService.isLoggedIn()) {
      <button type="button" class="icon-link icon-btn" (click)="openLoginModal()" aria-label="Log in">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
      </button>
    }

    <!-- Logged in: link to My Account (no dropdown) -->
    @if (authService.isLoggedIn()) {
      <a routerLink="/account" class="profile-trigger profile-link" aria-label="My Account">
        <span class="profile-avatar" aria-hidden="true">{{ authService.initials() }}</span>
        <span class="profile-name">{{ authService.displayName() }}</span>
      </a>
    }

    <div class="cart-icon-container" (click)="openCartModal()">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="cart-icon">
        <circle cx="9" cy="21" r="1"></circle>
        <circle cx="20" cy="21" r="1"></circle>
        <path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"></path>
      </svg>
      @if (cartItemCount > 0) {
        <span class="cart-badge">{{ cartItemCount }}</span>
      }
    </div>
  </div>
</header>

<!-- Cart Modal -->
<app-cart-modal
  [isOpen]="isCartModalOpen"
  (closeModal)="closeCartModal()"
  (requestLogin)="openLoginModal()">
</app-cart-modal>

<!-- Login Popup (same card as /login page) -->
<app-login-modal
  [isOpen]="isLoginModalOpen"
  (closeModal)="closeLoginModal()">
</app-login-modal>
