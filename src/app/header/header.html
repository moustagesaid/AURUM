<!-- src/app/shared/header/header.component.html -->
<header class="navbar-container">
  <!-- Gold Border Lines -->
  <div class="gold-line top"></div>
  <div class="gold-line bottom"></div>

  <!-- Left Section: Menu and Links -->
  <div class="nav-left">
    <a routerLink="/" routerLinkActive="active-nav-link" class="nav-link">Home</a>
    <a routerLink="/products" routerLinkActive="active-nav-link" class="nav-link">Products</a>
    <a routerLink="/contact" routerLinkActive="active-nav-link" class="nav-link">Contact</a>
    <a routerLink="/about" routerLinkActive="active-nav-link" class="nav-link">About Us</a>
  </div>

  <!-- Center Section: Logo -->
  <div class="nav-center">
    <a routerLink="/" class="logo-wrapper logo-link">
      <span class="logo-text">AURUM</span>
    </a>
  </div>

  <!-- Right Section: Icons -->
  <div class="nav-right">
    <app-theme-toggle></app-theme-toggle>
    <a routerLink="/products" class="icon-link">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
    </a>

    <!-- Logged out: login icon (opens modal) -->
    @if (!authService.isLoggedIn()) {
      <button type="button" class="icon-link icon-btn" (click)="openLoginModal()" aria-label="Log in">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
      </button>
    }

    <!-- Logged in: profile dropdown -->
    @if (authService.isLoggedIn()) {
      <div class="profile-trigger-wrap">
        <button
          type="button"
          class="profile-trigger"
          (click)="toggleProfileDropdown()"
          [attr.aria-expanded]="isProfileOpen"
          aria-haspopup="true"
          aria-label="Account menu"
        >
          <span class="profile-avatar" [attr.aria-hidden]="true">{{ authService.initials() }}</span>
          <span class="profile-name">{{ authService.displayName() }}</span>
          <svg class="profile-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>
        </button>
        @if (isProfileOpen) {
          <div class="profile-dropdown" role="menu">
            <div class="profile-dropdown-header">
              <span class="profile-dropdown-avatar">{{ authService.initials() }}</span>
              <div class="profile-dropdown-info">
                <span class="profile-dropdown-name">{{ authService.displayName() }}</span>
                <span class="profile-dropdown-email">{{ authService.user()?.email }}</span>
              </div>
            </div>
            <div class="profile-dropdown-divider"></div>
            <a routerLink="/account" class="profile-dropdown-item" (click)="closeProfileDropdown()" role="menuitem">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
              <span>My Account</span>
            </a>
            <a routerLink="/checkout" class="profile-dropdown-item" (click)="closeProfileDropdown()" role="menuitem">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path><line x1="3" y1="6" x2="21" y2="6"></line><path d="M16 10a4 4 0 0 1-8 0"></path></svg>
              <span>My Orders</span>
            </a>
            <div class="profile-dropdown-divider"></div>
            <button type="button" class="profile-dropdown-item profile-dropdown-logout" (click)="logout(); closeProfileDropdown()" role="menuitem">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
              <span>Log Out</span>
            </button>
          </div>
        }
      </div>
    }

    <div class="cart-icon-container" (click)="openCartModal()">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="cart-icon">
        <circle cx="9" cy="21" r="1"></circle>
        <circle cx="20" cy="21" r="1"></circle>
        <path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"></path>
      </svg>
      <span class="cart-badge" *ngIf="cartItemCount > 0">{{ cartItemCount }}</span>
    </div>
  </div>
</header>

<!-- Cart Modal -->
<app-cart-modal
  [isOpen]="isCartModalOpen"
  (closeModal)="closeCartModal()"
  (requestLogin)="openLoginModal()">
</app-cart-modal>

<!-- Login Popup (same card as /login page) -->
<app-login-modal
  [isOpen]="isLoginModalOpen"
  (closeModal)="closeLoginModal()">
</app-login-modal>
