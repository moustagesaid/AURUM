<div class="products-container" [class.men-bg]="selectedCategory === 'men'" [class.women-bg]="selectedCategory === 'women'" [class.couples]="selectedCategory === 'couples'">
  <!-- Category Selector -->
  <div class="category-selector">
    <button
      class="category-btn"
      [class.active]="selectedCategory === 'women'"
      (click)="selectCategory('women')"
    >
      FOR WOMEN
    </button>
    <button
      class="category-btn"
      [class.active]="selectedCategory === 'men'"
      (click)="selectCategory('men')"
    >
      FOR MEN
    </button>
    <button
      class="category-btn"
      [class.active]="selectedCategory === 'couples'"
      (click)="selectCategory('couples')"
    >
      OUR PACKS
    </button>
  </div>

  <!-- MEN & WOMEN Products Grid -->
  <div *ngIf="selectedCategory === 'men' || selectedCategory === 'women'" class="products-section">
    <div class="products-grid">
      <div *ngFor="let product of filteredProducts" class="product-card">
        <div class="product-image-wrapper">
          <img [src]="product.image" [alt]="product.name" class="product-image" />
        </div>
        <div class="product-info">
          <h3 class="product-name">{{ product.name }}</h3>
          <h4 class="product-subname">{{ product.subName }}</h4>
          <p class="product-price">${{ product.price.toFixed(2) }}</p>
          <button class="add-to-cart-btn" (click)="addToCart(product)">
            ADD TO CART
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- PACKS Section -->
  <div *ngIf="selectedCategory === 'couples'" class="packs-section">
    <div class="packs-banner">
      <div class="packs-content">
        <h2 class="packs-title">OUR PACKS</h2>
        <p class="packs-subtitle">Premium Fragrance Collections</p>
        <div class="packs-grid">
          <div *ngFor="let product of couplesProducts" class="pack-item">
            <div class="pack-image-wrapper">
              <img [src]="product.image" [alt]="product.name" class="pack-image" />
            </div>
            <div class="pack-info">
              <h3 class="pack-name">{{ product.name }}</h3>
              <p class="pack-subname">{{ product.subName }}</p>
              <span class="pack-price">${{ product.price.toFixed(2) }}</span>
              <button class="pack-add-to-cart-btn" (click)="addToCart(product)">
                ADD TO CART
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
