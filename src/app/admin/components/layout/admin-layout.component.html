<div class="admin-layout">
  <!-- Slim Glass Sidebar -->
  <aside
    class="sidebar"
    [class.collapsed]="isSidebarCollapsed"
    [class.mobile-open]="isMobileSidebarOpen"
  >
    <div class="sidebar-header">
      <div class="logo-container">
        <span class="logo-mark">A</span>
        <span class="logo-text" *ngIf="!isSidebarCollapsed">AURUM</span>
      </div>
    </div>

    <nav class="sidebar-nav">
      <a
        *ngFor="let item of navigationItems"
        [routerLink]="item.path"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: item.exact }"
        class="nav-item"
        [title]="item.title"
      >
        <span class="nav-icon">{{ item.icon }}</span>
        <span class="nav-label" *ngIf="!isSidebarCollapsed">{{ item.title }}</span>
      </a>
    </nav>

    <div class="sidebar-footer" *ngIf="!isSidebarCollapsed">
      <div class="user-profile">
        <div class="user-avatar">
          <span>{{ currentUser.name.charAt(0) }}</span>
        </div>
        <div class="user-details">
          <div class="user-name">{{ currentUser.name }}</div>
          <div class="user-role">{{ currentUser.role }}</div>
        </div>
      </div>
      <button class="logout-btn" type="button" (click)="logout()">
        <span class="logout-icon">⟵</span>
        <span>Logout</span>
      </button>
    </div>

    <div class="sidebar-footer-collapsed" *ngIf="isSidebarCollapsed">
      <button class="logout-btn-collapsed" type="button" (click)="logout()" title="Logout">
        <span>⟵</span>
      </button>
    </div>
  </aside>

  <main class="main-content" [class.expanded]="isSidebarCollapsed">
    <header class="top-bar">
      <div class="top-bar-left">
        <button
          class="sidebar-toggle"
          [class.is-open]="isMobileSidebarOpen"
          (click)="toggleSidebar()"
          type="button"
          aria-label="Toggle navigation"
        >
          <span class="burger-line"></span>
          <span class="burger-line"></span>
          <span class="burger-line"></span>
        </button>
        <div class="search-container">
          <span class="search-icon" aria-hidden="true">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          </span>
          <input type="text" placeholder="Search collection..." class="search-input" />
        </div>
      </div>
      <div class="top-bar-right">
        <div class="admin-profile">
          <div class="admin-avatar">
            <span>{{ currentUser.name.charAt(0) }}</span>
          </div>
          <div class="admin-meta">
            <span class="admin-name">{{ currentUser.name }}</span>
            <span class="admin-role">{{ currentUser.role }}</span>
          </div>
        </div>
      </div>
    </header>

    <div class="content-area">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
